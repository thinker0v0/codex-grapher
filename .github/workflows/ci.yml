name: Local foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Install test prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify local foundation
        run: bash scripts/verify-foundation.sh
      - name: Run offline example
        run: python examples/offline_demo.py
      - name: Install developer package
        run: python -m pip install .
      - name: Exercise installed workflow outside checkout
        run: |
          cd "$RUNNER_TEMP"
          codex-grapher doctor --json
          codex-grapher demo --workspace "$RUNNER_TEMP/grapher-ci" --stop-after built --json
          codex-grapher recover --workspace "$RUNNER_TEMP/grapher-ci" --json
          codex-grapher rollback --workspace "$RUNNER_TEMP/grapher-ci" --json
