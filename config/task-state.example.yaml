states:
  normal:
    - RECEIVED
    - AUTHORIZED
    - NORMALIZED
    - PLANNED
    - QUEUED
    - LEASED
    - RUNNING
    - EVIDENCE_PENDING
    - EVALUATING
    - REWORK_REQUESTED
    - PASSED
    - HUMAN_APPROVAL_PENDING
    - COMPLETED
  terminal:
    - REJECTED
    - CANCELLED
    - FAILED_PERMANENT
    - FAILED_BUDGET
    - FAILED_TIMEOUT
    - FAILED_STAGNATION
    - FAILED_GATE
    - NEEDS_HUMAN
    - SUPERSEDED

transitions:
  RECEIVED: [AUTHORIZED, REJECTED]
  AUTHORIZED: [NORMALIZED, REJECTED]
  NORMALIZED: [PLANNED, REJECTED]
  PLANNED: [QUEUED, REJECTED]
  QUEUED: [LEASED, CANCELLED, FAILED_BUDGET, FAILED_TIMEOUT]
  LEASED: [RUNNING, QUEUED, CANCELLED]
  RUNNING: [EVIDENCE_PENDING, CANCELLED, FAILED_PERMANENT, FAILED_BUDGET, FAILED_TIMEOUT]
  EVIDENCE_PENDING: [EVALUATING, FAILED_GATE]
  EVALUATING: [REWORK_REQUESTED, PASSED, FAILED_GATE, NEEDS_HUMAN]
  REWORK_REQUESTED: [QUEUED, FAILED_STAGNATION, FAILED_BUDGET, FAILED_TIMEOUT]
  PASSED: [HUMAN_APPROVAL_PENDING, COMPLETED]
  HUMAN_APPROVAL_PENDING: [COMPLETED, REJECTED, NEEDS_HUMAN]

invariants:
  append_only_events: true
  optimistic_versioning: true
  terminal_mutation_forbidden: true
  retry_creates_attempt: true
  changed_input_creates_task: true
  late_results_quarantined: true
  side_effect_intent_before_execution: true
